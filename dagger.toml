# Dagger workspace configuration
# Install modules with: dagger install <module>
# Example:
#   dagger install github.com/dagger/dagger/modules/wolfi

[modules.e2e]
source = ".dagger/modules/e2e"

[modules.dang-sdk]
source = "."

[sdks.dang]
module = "dang-sdk"

[sdks.dang.scopes.".dagger/modules/e2e/fixtures/lookup-toml/app"]
is-module = true
name = "lookup-toml-app"
